# Socket Mode常駐VMだけに渡す、秘密でない環境変数（NAME=VALUEを1行に1件）。
# scripts/slack-socket-vm.shが、Cloud Runから引き継いだ同名の値をここで置き換える。
# Cloud Runには適用しない。秘密の値は書かない（secretの名前とは重ねられない）。
# 一時的に変えるときは、配備時に --env NAME=VALUE を渡す（その配備だけ有効）。

# 定期処理をVMのprocess内で動かす。止めるときはoffにする。
# docs/slack-socket-vm-runbook.mdの「定期処理」を参照。
AR_SCHEDULER=inprocess
