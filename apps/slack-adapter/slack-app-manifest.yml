display_information:
  name: ART-TRA Work Lab
  description: GitHubの仕事を人間向けに整理してSlackへ届けるテストアプリ
  background_color: "#1D3557"
features:
  bot_user:
    display_name: ART-TRA Work Lab
    always_online: false
  slash_commands:
    - command: /ar
      description: 自分が次に行う仕事を表示する
      usage_hint: "new | connect github | disconnect github | approval <id> | project sync"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - channels:read
      - chat:write
      - commands
      - groups:read
      - lists:read
      - lists:write
      - users:read
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
