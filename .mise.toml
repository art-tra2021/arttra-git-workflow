min_version = "2026.2.2"

[settings]
experimental = true
lockfile = true

[tools]
rust = { version = "1.93.0", components = "clippy,rustfmt" }
bun = "1.3.14"
node = "24.18.1"
gh = "2.97.0"
hk = "1.54.0"
jq = "1.8.2"
yq = "4.53.3"
actionlint = "1.7.12"
gitleaks = "8.30.1"
rumdl = "0.2.47"
shellcheck = "0.11.0"
shfmt = "3.13.1"
taplo = "0.10.0"
typos = "1.48.0"
zizmor = "1.28.0"
"osv-scanner" = "2.4.0"

[env]
CARGO_TERM_COLOR = "always"
HK_MISE = "1"

[tasks.build]
description = "Build git-ar"
run = "cargo build --locked"

[tasks.check]
description = "Type-check the workspace"
run = "cargo check --locked"

[tasks."fmt:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.test]
description = "Run tests"
run = "cargo test --locked"

[tasks.clippy]
description = "Run clippy with warnings denied"
run = "cargo clippy --locked --all-targets -- -D warnings"

[tasks.lint]
description = "Run the shared cross-language linters"
run = "hk check --all --check"

[tasks."security:actions"]
description = "Audit GitHub Actions for unsafe patterns"
run = "zizmor .github/workflows"

[tasks."security:secrets"]
description = "Scan the working tree for secrets without printing them"
run = "gitleaks dir . --redact --no-banner"

[tasks.security]
description = "Run deterministic security checks"
depends = ["security:actions", "security:secrets"]

[tasks."security:dependencies"]
description = "Scan supported lockfiles for known vulnerabilities"
run = "osv-scanner scan source -r ."

[tasks.typos]
description = "Run the advisory spelling check"
run = "typos"

[tasks.verify]
description = "Run every local and CI quality gate"
depends = [
  "fmt:check",
  "check",
  "test",
  "clippy",
  "lint",
  "security:actions",
  "slack:check",
  "setup-ui:test",
  "issue-policy:test",
  "merge-authority-policy:test",
  "pr-policy:test",
  "pr-health:test",
  "templates:check",
]

[tasks."templates:check"]
description = "Validate repository template profiles and local-only paths"
run = "bash scripts/template-check.sh"

[tasks."slack:install"]
description = "Install the locked Slack adapter dependencies"
run = "bun install --cwd apps/slack-adapter --frozen-lockfile"

[tasks."slack:check"]
description = "Type-check, lint, and test the Slack adapter"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter check"

[tasks."slack:dev"]
description = "Slack adapterをSocket Modeで起動する"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter start"

[tasks."slack:list"]
description = "GitHub Projectsの現在状態をSlack Listへ同期する"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter project-list:sync"

[tasks."slack:list:json"]
description = "GitHub ProjectsからSlack Listへ同期し、AI向けJSON結果を返す"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter project-list:sync -- --json"

[tasks."slack:calendar"]
description = "本人担当の期限付きProjects項目をGoogle Calendarへ同期する"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter calendar:sync --"

[tasks."slack:canvas"]
description = "GitHub Projectsを実Slack Canvasへscope付きで同期する"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter project-canvas:sync --"

[tasks."slack:canvas:json"]
description = "GitHub ProjectsからSlack Canvasへ同期しAI向けJSON結果を返す"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter project-canvas:sync -- --json"

[tasks."slack:approval"]
description = "Issue承認のversion付きJSON statusを取得する"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter approval:status --"

[tasks."slack:review"]
description = "PR review依頼の人間向けread modelをJSONで取得する"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter review:status --"

[tasks."slack:outbox:audit"]
description = "送信結果が不明なSlack通知と旧GitHub deliveryを監査する"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter outbox:audit --"

[tasks."slack:outbox:audit:json"]
description = "通知outboxの監査結果をAI向けJSONで取得する"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter outbox:audit -- --json"

[tasks."slack:outbox:replay"]
description = "Slack API照合後に通知outboxをdry-runまたは確認付きで復旧する"
depends = ["slack:install"]
run = "bun run --cwd apps/slack-adapter outbox:replay --"

[tasks."slack:container"]
description = "Cloud Run用Slack adapter imageをbuildする"
run = """
docker build --file apps/slack-adapter/Dockerfile --tag arttra-slack-adapter:test .
bash scripts/slack-container-smoke.sh
"""

[tasks.quick]
description = "Run fast checks while editing"
depends = ["fmt:check", "check"]

[tasks.setup]
description = "Backward-compatible alias for setup-ar"
quiet = true
raw = true
run = "mise run setup-ar"

[tasks.setup-ar]
description = "Install the shared toolchain, git-ar, hooks, and AI integration"
quiet = true
raw = true
run = "bash scripts/setup-ui.sh"

[tasks.setup-demo]
description = "Run only the responsive setup screen demo without changing the environment"
quiet = true
raw = true
run = "bash scripts/setup-ui.sh --preview"

[tasks.setup-demo-failure]
description = "Preview the setup failure screen without changing the environment"
quiet = true
raw = true
run = "bash scripts/setup-ui.sh --preview --fail-at integrations"

[tasks."setup-log:copy"]
description = "Copy the latest redacted setup failure log to the clipboard"
quiet = true
raw = true
run = "bash scripts/setup-ui.sh --copy-latest-log"

[tasks."setup-log:show"]
description = "Print the latest redacted setup failure log"
quiet = true
raw = true
run = "bash scripts/setup-ui.sh --show-latest-log"

[tasks."setup-ui:test"]
description = "Test setup failure logs and cross-platform clipboard backends"
run = "bash scripts/setup-ui-test.sh"

[tasks."pr-policy:test"]
description = "Test deterministic Pull Request to primary Issue policy"
run = "bash scripts/pr-policy-test.sh"

[tasks."issue-policy:test"]
description = "Test deterministic Issue hierarchy policy"
run = "bash scripts/issue-policy-test.sh"

[tasks."merge-authority-policy:test"]
description = "Test deterministic privileged merge authority policy"
run = "bash scripts/merge-authority-policy-test.sh"

[tasks."pr-health:test"]
description = "Test deterministic PR health labels and summary"
run = "bash scripts/pr-health-test.sh"

[tasks.ar]
description = "Run git-ar from source"
run = "cargo run --quiet --"

[tasks."ar:check"]
description = "Run every gate through the human-friendly git-ar entrypoint"
run = "git ar check"

[tasks."ar:check-json"]
description = "Run every gate and return captured diagnostics as JSON"
run = "git ar check --json"

[tasks.doctor]
description = "Check the local ART-TRA development environment"
run = "git ar doctor"

[tasks.ready]
description = "Confirm setup and show the next action"
run = """
git ar doctor
git ar presence status
git ar check
git ar status
"""

[tasks.context]
description = "Show the current repository and worktree context"
run = "git ar context"

[tasks.policy]
description = "Show the effective ART-TRA policy"
run = "git ar policy"

[tasks.rules]
description = "Show Rulesets and recent Rule Insights"
run = "git ar rules"

[tasks."rules:json"]
description = "Return Rulesets and recent Rule Insights as JSON"
run = "git ar rules --json"

[tasks."properties:plan"]
description = "Preview Organization Custom Property changes"
run = "git ar properties --organization art-tra2021 --dry-run"

[tasks."properties:apply"]
description = "Apply Organization Custom Property changes after explicit confirmation"
run = "git ar properties --organization art-tra2021 --apply --yes"

[tasks.tasks]
description = "Show Issues assigned to the current GitHub user"
run = "git ar tasks --dashboard"

[tasks.dashboard]
description = "Open the optional human GitHub dashboard"
run = "gh dash"

[tasks."extensions:install"]
description = "Install reviewed, optional GitHub extensions at fixed versions"
run = """
gh ext install dlvhdr/gh-dash --pin v4.25.2 --force
gh ext install seachicken/gh-poi --pin v0.18.3 --force
"""

[tasks."branches:clean"]
description = "Remove local branches whose squash-merged PRs are closed"
run = "gh poi"

[tasks.telemetry]
description = "Summarize local privacy-safe policy events"
run = "git ar telemetry"

[tasks."ai:setup"]
description = "Refresh local, untracked Claude and Codex integrations"
run = "git ar setup"

[tasks."presence:snapshot"]
description = "Preview the changed-file metadata shared with teammates"
run = "git ar presence snapshot"

[tasks."presence:publish"]
description = "Publish changed-file metadata once"
run = "git ar presence publish --yes"

[tasks."presence:check"]
description = "Check active worktrees for overlapping files"
run = "git ar presence check"

[tasks."presence:watch"]
description = "Publish changed-file metadata periodically"
run = "git ar presence watch --yes"

[tasks."presence:install"]
description = "Install periodic presence publishing for this repository"
run = "git ar presence install --yes"

[tasks."presence:status"]
description = "Show periodic presence publisher status"
run = "git ar presence status"

[tasks."presence:uninstall"]
description = "Remove periodic presence publishing for this repository"
run = "git ar presence uninstall --yes"
