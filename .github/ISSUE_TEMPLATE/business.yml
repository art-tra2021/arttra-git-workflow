name: 営業・業務変更
description: 複数のTaskを束ねる営業・業務成果の調整Issue。Slackでは独立した親投稿を持つ
title: "[Business] "
labels: ["type/business", "status/todo"]
body:
  - type: input
    id: parent
    attributes:
      label: 親Intake
      description: type/intake Issueを1件指定する。別repositoryの場合はIssue URLを書く。例：#123
    validations:
      required: true
  - type: textarea
    id: current
    attributes:
      label: 現状
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: 変更する文書・条件・運用
    validations:
      required: true
  - type: textarea
    id: approval
    attributes:
      label: 誰が何を確認すればよいか
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 対象・影響・触らない範囲
      description: 対象文書・顧客・運用、影響、変更しない境界を書く。
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 今回やらないこと
      description: 別Issueへ分けた内容や、今回の完了条件に含めない内容を書く。
  - type: textarea
    id: known_constraints
    attributes:
      label: 既知の制約・懸念
      description: 制約がなければ空欄でよい。高リスク変更では切り戻し方法も書く。
  - type: textarea
    id: verification
    attributes:
      label: 確認方法
      description: 変更結果を誰がどの手順で確認できるかを書く。
    validations:
      required: true
  - type: input
    id: target_date
    attributes:
      label: 目標日
      description: 例：2026-08-15
