name: PR実装タスク
description: WorkまたはBusinessを分解した、ちょうど1つのPRで完了する実装単位
title: "[Task] "
labels: ["type/task", "status/todo", "merge/review"]
body:
  - type: markdown
    attributes:
      value: |
        Taskのマージ方針はラベルを正本とします。GitHub Issue Formでは既定の `merge/review` が付きます。
        `merge/self` または `merge/emergency` が必要な場合は、作成後にラベルを1件だけ付け替えるか、Slackの `/ar new` または `git ar issue` を使用してください。
  - type: input
    id: parent
    attributes:
      label: 親Work / Business
      description: type/work または type/business のIssueを1件指定する。別repositoryの場合はIssue URLを書く。例：#123
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: このPRで実装すること
      description: 親Issueの成果へ寄与し、1つのPRで完了できる単位を書く。
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 触ってよい範囲・触らない範囲
      description: 他の人へ渡せるTaskでは、対象、禁止範囲、確認方法、相談先を記載する。
