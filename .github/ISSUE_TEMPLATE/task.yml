name: 小タスク
description: 作業チケットを分解した、単独PRにしない小さな行動
title: "[Task] "
labels: ["type/task", "status/todo"]
body:
  - type: input
    id: parent
    attributes:
      label: 親の作業チケット
      description: 例：#123
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: やること
      description: 親Issueの成果へどう寄与するかが分かる単位で書く。
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      value: "- [ ] "
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: 触ってよい範囲・触らない範囲
      description: 他の人へ渡せるTaskでは、対象、禁止範囲、確認方法、相談先を記載する。
