name: 開発成果（Work）
description: 複数のTaskを束ねる開発成果の調整Issue。Slackでは独立した親投稿を持つ
title: "[Work] "
labels: ["type/work", "status/todo"]
body:
  - type: input
    id: parent
    attributes:
      label: 親Intake
      description: type/intake Issueを1件指定する。別repositoryの場合はIssue URLを書く。例：#123
    validations:
      required: true
  - type: textarea
    id: background
    attributes:
      label: 背景
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: 完成するとどうなるか
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: 完了条件
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: 対象・影響・触らない範囲
      description: 変更対象、影響する利用者や機能、変更しない境界を短く書く。
    validations:
      required: true
  - type: textarea
    id: out_of_scope
    attributes:
      label: 今回やらないこと
      description: 別Issueへ分けた内容や、今回の完了条件に含めない内容を書く。
  - type: textarea
    id: known_constraints
    attributes:
      label: 既知の制約・懸念
      description: 制約がなければ空欄でよい。高リスク変更では切り戻し方法も書く。
  - type: textarea
    id: verification
    attributes:
      label: 確認方法
      description: 完了条件を誰がどの手順で確認できるかを書く。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 依頼者の受入確認（必要な場合）
      description: 実現したこと、確認手順、確認点、既存影響、対象外、制約をまとめる。不要なら空欄でよい。
  - type: input
    id: blocked_by
    attributes:
      label: ブロック元
      description: なければ空欄。例：#123
  - type: input
    id: target_date
    attributes:
      label: 目標日
      description: Projectsへ登録する日付。例：2026-08-15
