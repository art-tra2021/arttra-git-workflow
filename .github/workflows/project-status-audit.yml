name: Project Status drift audit

on:
  workflow_dispatch:
  schedule:
    - cron: "37 */4 * * *"

permissions:
  contents: read
  issues: read
  repository-projects: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install audit tools from mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
          install_args: gh jq

      - name: Install pinned Rust toolchain
        run: mise install rust

      - name: Audit Project Status against compatibility labels
        env:
          GH_TOKEN: ${{ secrets.ARTTRA_PROJECT_AUDIT_TOKEN || github.token }}
        run: bash scripts/project-status-audit.sh
