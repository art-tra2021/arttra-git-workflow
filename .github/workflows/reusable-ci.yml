name: Reusable CI

on:
  workflow_call:
    inputs:
      profile:
        description: Repository profile (rust, python, typescript)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          cache: true
      - name: Verify toolchain policy
        run: |
          case "${{ inputs.profile }}" in
            rust|python|typescript) ;;
            *) echo "Unknown profile: ${{ inputs.profile }}" >&2; exit 1 ;;
          esac
      - name: Run repository-owned verification
        run: mise run verify
