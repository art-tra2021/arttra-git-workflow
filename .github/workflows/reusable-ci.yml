name: Reusable CI

on:
  workflow_call:
    inputs:
      profile:
        description: Repository profile (rust, python, typescript)
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
          install_args: >-
            gh hk jq yq actionlint gitleaks rumdl shellcheck shfmt taplo typos
            zizmor osv-scanner
      - name: Install pinned Rust toolchain
        run: mise install rust
      - name: Verify toolchain policy
        env:
          PROFILE: ${{ inputs.profile }}
        run: |
          case "$PROFILE" in
            rust|python|typescript) ;;
            *) echo "Unknown profile: $PROFILE" >&2; exit 1 ;;
          esac
      - name: Run repository-owned verification
        run: mise run verify
